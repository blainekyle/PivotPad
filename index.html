<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pivot Pad</title>
    <style>
        body {
            font-family: Ubuntu, 'Trebuchet MS', sans-serif;
            margin: 0;
            padding: 0 1em 1em 1em;
            overflow: hidden;
            height: 100vh;
            background-color: #369;
            color: #fff;
        }
        h1 {
            text-align: center;
            margin: 0.5em 0;
            opacity: 0.9;
            font-size: 1.5rem;
            text-shadow: 1px 1px 2px #000;
            letter-spacing: 2px;
            pointer-events: none;
        }
        h1:after {
            content: "v1.9.0 ©Blaine Kyle Evans";
            display: block;
            margin: auto;
            font-size: 0.7rem;
            color: #ccc;
        }
        .container {
            display: flex;
            gap: 1em;
            height: calc(100vh - 180px);
            min-height: 200px;
        }
        .input-area, .output-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 1rem;
            line-height: 1.5;
            resize: none;
            border-radius: 6px;
            border: 2px solid transparent;
            background-color: rgba(255, 255, 255, 0.95);
            color: #333;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #46BDF0;
            box-shadow: 0 0 8px rgba(70, 189, 240, 0.5);
        }

        .controls {
            box-sizing: border-box;
            margin-bottom: 1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1em;
            padding: 0.8em 1.2em;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .controls label {
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        #delimiterInput {
            width: 40px;
            padding: 4px;
            text-align: center;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-weight: bold;
            font-family: monospace;
        }

        #copyButton {
            padding: 0.6em 1.2em;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background-color: #28a745;
            color: white;
            border-radius: 4px;
            transition: background-color 0.2s, transform 0.1s;
        }
        #copyButton:hover { background-color: #218838; }
        #copyButton:active { transform: translateY(1px); }
        #copyButton:disabled { opacity: 0.7; cursor: default; }
        
        .copied-success { background-color: #1e7e34 !important; }
        .copied-error { background-color: #dc3545 !important; }

        .area-label {
            display: block;
            margin-bottom: 0.4em;
            font-weight: bold;
            color: #def;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .banner-bottom {
            position: fixed;
            left: 0;
            bottom: 0;
            margin: 0;
            width: 100vw;
            text-align: center;
            padding: 2px;
            font-weight: bolder;
            color: #fff;
            text-shadow: 0 0 3px #000c;
            background-color: #0003;
            transition: ease-in-out;
            transition-duration: 450ms;
        }
        .banner-bottom:hover {
            font-size: 2em;
            padding: 8px;
            background-color: #000a;
            box-shadow: 0 0 12px #000c;

        }

        @media (max-width: 600px) {
            .container { flex-direction: column; height: calc(100vh - 220px); }
            .controls { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <h1>PIVOT PAD</h1>

    <div class="controls">
        <div class="control-group">
            <input type="checkbox" id="omitBlanksCheckbox" style="cursor: pointer;">
            <label for="omitBlanksCheckbox">Omit blank lines</label>
        </div>
        
        <div class="control-group">
            <label for="delimiterInput">Delimiter:</label>
            <input type="text" id="delimiterInput" value="," maxlength="5" title="Character(s) used to separate the list">
        </div>

        <div class="control-group">
            <button id="copyButton">Copy Output</button>
        </div>
    </div>

    <div class="container">
        <div class="input-area">
            <label class="area-label" for="inputText">List View (One per line)</label>
            <textarea id="inputText" placeholder="Item 1&#10;Item 2&#10;Item 3..."></textarea>
        </div>
        <div class="output-area">
            <label class="area-label" for="outputText">Delimited View (CSV)</label>
            <textarea id="outputText" placeholder="Item 1, Item 2, Item 3..."></textarea>
        </div>
    </div>
    
    <a href="ppclassic.html" target="_self"><div class="banner-bottom">Switch to Pivot Pad Classic</div></a>

    <script>
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const omitBlanksCheckbox = document.getElementById('omitBlanksCheckbox');
        const delimiterInput = document.getElementById('delimiterInput');
        const copyButton = document.getElementById('copyButton');

        // Main logic to update CSV from List
        function updateFromList() {
            const delimiter = delimiterInput.value || ',';
            let lines = inputText.value.split('\n');
            
            if (omitBlanksCheckbox.checked) {
                lines = lines.filter(line => line.trim() !== '');
            }
            
            outputText.value = lines.join(delimiter);
        }

        // Main logic to update List from CSV
        function updateFromCSV() {
            const delimiter = delimiterInput.value || ',';
            if (!delimiter) return;

            // Escape delimiter for regex if necessary (simple approach)
            const escapedDelimiter = delimiter.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(escapedDelimiter, 'g');
            
            let items = outputText.value.split(delimiter);
            
            if (omitBlanksCheckbox.checked) {
                items = items.filter(item => item.trim() !== '');
            }
            
            inputText.value = items.join('\n');
        }

        // Event Listeners
        inputText.addEventListener('input', updateFromList);
        outputText.addEventListener('input', updateFromCSV);
        omitBlanksCheckbox.addEventListener('change', updateFromList);
        delimiterInput.addEventListener('input', updateFromList);

        // Copy functionality
        copyButton.addEventListener('click', () => {
            const textToCopy = outputText.value;
            if (!textToCopy) return;

            const originalText = copyButton.innerText;
            
            const handleFeedback = (success) => {
                copyButton.innerText = success ? 'Copied!' : 'Error';
                copyButton.classList.add(success ? 'copied-success' : 'copied-error');
                copyButton.disabled = true;
                setTimeout(() => {
                    copyButton.innerText = originalText;
                    copyButton.classList.remove('copied-success', 'copied-error');
                    copyButton.disabled = false;
                }, 1500);
            };

            // Preferred method for clipboard in iframes/sandboxes
            try {
                outputText.select();
                const successful = document.execCommand('copy');
                if (successful) {
                    handleFeedback(true);
                } else {
                    // Try modern API if execCommand fails
                    navigator.clipboard.writeText(textToCopy)
                        .then(() => handleFeedback(true))
                        .catch(() => handleFeedback(false));
                }
            } catch (err) {
                handleFeedback(false);
            }
        });

        // Initialize
        updateFromList();
    </script>

</body>
</html>
